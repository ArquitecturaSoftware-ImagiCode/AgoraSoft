<div class="w-full flex justify-center items-center min-h-screen bg-gray-50">
  <form
    #loginForm="ngForm"
    (ngSubmit)="onLogin()"
    class="space-y-5 bg-white p-8 rounded-2xl shadow-lg w-full max-w-md"
  >
    <div>
      <h1 class="text-3xl font-bold text-center text-blue-900">Inicia Sesión</h1>
      <p class="text-gray-500 text-sm mt-2 text-center">
        Completa todos los campos para iniciar sesión.
      </p>
    </div>

    <div class="mt-5 space-y-4">
      <fieldset class="fieldset">
        <legend class="text-md">Correo</legend>
        <input
          type="email"
          class="input w-full border border-gray-300 rounded-md p-2"
          name="email"
          [(ngModel)]="email"
          required
          email
          placeholder="ej. correo@email.com"
          #emailCtrl="ngModel"
        />
        <p class="label text-red-500 text-sm mt-1" *ngIf="emailCtrl.invalid && emailCtrl.touched">
          <span *ngIf="emailCtrl.errors?.['required']">Correo es obligatorio</span>
          <span *ngIf="emailCtrl.errors?.['email']">Correo inválido</span>
        </p>
      </fieldset>

      <fieldset class="fieldset">
        <legend class="text-md">Contraseña</legend>
        <input
          type="password"
          class="input w-full border border-gray-300 rounded-md p-2"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          placeholder="Contraseña"
          #passwordCtrl="ngModel"
        />
        <p class="label text-red-500 text-sm mt-1" *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
          <span *ngIf="passwordCtrl.errors?.['required']">Contraseña es obligatoria</span>
          <span *ngIf="passwordCtrl.errors?.['minlength']">Mínimo 6 caracteres</span>
        </p>
      </fieldset>

      <button
        type="submit"
        class="btn bg-blue-900 text-white w-full mt-4 py-2 rounded-md hover:bg-blue-800 transition"
        [disabled]="loginForm.invalid"
      >
        Iniciar Sesión
      </button>
    </div>

    <div class="flex justify-between text-sm items-center mt-3">
      <p class="text-gray-500">¿No tienes cuenta?</p>
      <a class="text-blue-800 underline" routerLink="/cliente/register">Crear cuenta</a>
    </div>
  </form>
</div>
